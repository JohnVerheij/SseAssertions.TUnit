name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref to avoid wasting minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Shared family CI: build, tests with coverage, license gate, pack, smoke test against the packed
    # package, Native AOT gate. See https://github.com/JohnVerheij/assertions-ci for the inputs and the
    # repository contract.
    uses: JohnVerheij/assertions-ci/.github/workflows/package-ci.yml@7db16f705d375ef388195885c83abb9b8fd47efa # feat/package-ci (pre-release)
    with:
      package: SseAssertions
    permissions:
      contents: read
      id-token: write   # Codecov upload through OIDC
